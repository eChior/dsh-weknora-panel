<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原件预览</title>
<link rel="stylesheet" href="./pdf_viewer.css">
<style>
  html, body { margin: 0; height: 100%; background: #f5f5f5; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; min-height: 0; }

  #bar {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    padding: 6px 10px; background: #fff; border-bottom: 1px solid rgba(0,0,0,.08);
    font-size: 12px; color: #333;
  }
  #bar button {
    border: 1px solid rgba(0,0,0,.14); background: #fff; border-radius: 6px;
    height: 26px; min-width: 26px; padding: 0 8px; cursor: pointer; font-size: 12px; color: #333;
  }
  #bar button:hover { border-color: #0052d9; color: #0052d9; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #pageNum {
    width: 52px; height: 26px; box-sizing: border-box; text-align: center;
    border: 1px solid rgba(0,0,0,.14); border-radius: 6px; font-size: 12px;
  }
  #bar .sep { width: 1px; height: 18px; background: rgba(0,0,0,.1); margin: 0 4px; }
  #bar .grow { flex: 1; }
  #stat { color: #888; font-size: 11px; }

  #viewerContainer {
    position: relative; flex: 1; min-height: 0; overflow: auto;
    background: #f5f5f5;
  }
  #viewer { position: relative; }

  /* 高亮：文字层里的命中片段 */
  .wk-hl {
    position: absolute; pointer-events: none;
    background: rgba(255, 214, 10, .42);
    border-radius: 2px; mix-blend-mode: multiply;
  }

  #tip { position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    background: rgba(0,0,0,.72); color: #fff; font-size: 12px; padding: 6px 10px;
    border-radius: 6px; display: none; z-index: 50; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="prev" title="上一页">‹</button>
    <input id="pageNum" type="number" min="1" value="1">
    <span id="pageCount">/ -</span>
    <span class="sep"></span>
    <button id="zoomOut" title="缩小">−</button>
    <span id="zoomVal">100%</span>
    <button id="zoomIn" title="放大">＋</button>
    <button id="fit" title="适应宽度">适应宽度</button>
    <span class="grow"></span>
    <span id="stat"></span>
    <span class="sep"></span>
    <button id="next" title="下一页">›</button>
  </div>
  <div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
    <div id="tip"></div>
  </div>
</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
